<style>
/* layout: app shell. top bar with views and audience depth; a place x indicator matrix; a detail drawer that
   opens a cell as its four elements (place, dataset, method, delivery) bound by a hashed configuration */
:root {
  --bg: #eef3f4; --surface: #ffffff; --sunk: #e3eaec; --ink: #0f222a; --muted: #566a73; --line: #d3dee2;
  --accent: #0b5d6e; --accent-ink: #ffffff; --accent-soft: #d5e9ec;
  --el-place: #2b66ad; --el-data: #2a8455; --el-method: #cf7a22; --el-delivery: #bd3f36; --el-config: #74818a;
  --ok: #2a8455; --warn: #b7791f; --run: #2b66ad;
  --ramp-0: #e7f1f2; --ramp-1: #b5d8dc; --ramp-2: #6fb3bd; --ramp-3: #2d8494; --ramp-4: #0b4f5e;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c171c; --surface: #12212a; --sunk: #0a1419; --ink: #e2ecef; --muted: #93a8b1; --line: #233741;
  --accent: #5cc0cf; --accent-ink: #062027; --accent-soft: #163c45;
  --el-place: #6fa3e6; --el-data: #5fc08b; --el-method: #f0a453; --el-delivery: #ef7a70; --el-config: #9aa7b0;
  --ok: #5fc08b; --warn: #e9b44c; --run: #6fa3e6;
  --ramp-0: #15323a; --ramp-1: #1d5260; --ramp-2: #2b7f8f; --ramp-3: #4fb0bf; --ramp-4: #a6e3eb;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c171c; --surface: #12212a; --sunk: #0a1419; --ink: #e2ecef; --muted: #93a8b1; --line: #233741;
  --accent: #5cc0cf; --accent-ink: #062027; --accent-soft: #163c45;
  --el-place: #6fa3e6; --el-data: #5fc08b; --el-method: #f0a453; --el-delivery: #ef7a70; --el-config: #9aa7b0;
  --ok: #5fc08b; --warn: #e9b44c; --run: #6fa3e6;
  --ramp-0: #15323a; --ramp-1: #1d5260; --ramp-2: #2b7f8f; --ramp-3: #4fb0bf; --ramp-4: #a6e3eb;
  color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar ---- */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand b { font: 700 20px/1 var(--f-display); letter-spacing: -0.01em; }
.brand span { font: 500 13px var(--f-display); color: var(--muted); }
.sponsor { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.sponsor strong { color: var(--ink); font-weight: 600; }
nav.views { display: flex; gap: 2px; }
nav.views button { border: 0; background: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 500; }
nav.views button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); }
.depth { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.depth button { border: 0; background: none; padding: 6px 11px; cursor: pointer; font-size: 13px; color: var(--muted); }
.depth button + button { border-left: 1px solid var(--line); }
.depth button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.depth-note { font-size: 12px; color: var(--muted); padding-bottom: 8px; }

main { padding-block: 16px 40px; display: grid; gap: 14px; }
.mock { font-size: 12px; color: var(--muted); }
.mock b { color: var(--ink); font-weight: 600; }

/* filters ---- */
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.filters .lbl { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.search { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; min-width: 0; width: 220px; max-width: 100%; }

/* matrix ---- */
.matrix-box { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table.matrix { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-variant-numeric: tabular-nums; }
.matrix th, .matrix td { border-bottom: 1px solid var(--line); padding: 0; }
.matrix thead th { position: sticky; top: 0; background: var(--surface); z-index: 2; text-align: left; vertical-align: bottom; padding: 10px 10px 8px; min-width: 128px; }
.matrix thead th .fam { display: block; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.matrix thead th .t { font-weight: 600; font-size: 13px; line-height: 1.2; display: block; }
.matrix thead th .u { font-size: 11.5px; color: var(--muted); }
.matrix th.place { position: sticky; left: 0; z-index: 3; background: var(--surface); min-width: 210px; max-width: 240px; padding: 8px 12px; text-align: left; border-right: 1px solid var(--line); }
.matrix tbody th.place { z-index: 1; font-weight: 500; }
.matrix tbody th.place small { display: block; color: var(--muted); font-weight: 400; font-size: 11.5px; font-family: var(--f-mono); }
.matrix tr.group th { background: var(--sunk); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 12px; text-align: left; position: sticky; left: 0; }
.cell { display: flex; flex-direction: column; gap: 2px; width: 100%; min-height: 54px; padding: 7px 10px; border: 0; background: none; text-align: left; cursor: pointer; }
.cell:hover { background: var(--accent-soft); }
.cell .v { font-weight: 600; font-size: 13.5px; }
.cell .v small { font-weight: 400; color: var(--muted); font-size: 11px; }
.cell .h { font: 10.5px var(--f-mono); color: var(--muted); }
.cell svg { display: block; }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; border-radius: 999px; padding: 2px 8px; width: fit-content; border: 1px solid var(--line); color: var(--muted); }
.st.live { border-style: dashed; border-color: var(--el-data); color: var(--el-data); }
.st.auto { border-color: var(--accent); color: var(--accent); }
.st.review { border-color: var(--warn); color: var(--warn); }
.st.running { border-color: var(--run); color: var(--run); }
.st.queued { color: var(--run); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.running .dot { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .running .dot { animation: none; } }
.na { color: var(--muted); font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 12px; color: var(--muted); }

/* drawer ---- */
.scrim { position: fixed; inset: 0; background: #0006; z-index: 20; }
aside.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 21; border-left: 1px solid var(--line);
  overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 20px; display: grid; gap: 16px; align-content: start; }
.dh { display: flex; gap: 12px; align-items: start; }
.dh h2 { font: 700 21px/1.15 var(--f-display); margin: 0; text-wrap: balance; }
.dh p { margin: 3px 0 0; color: var(--muted); }
.close { margin-left: auto; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
.elements { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.el { border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.el .k { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--c); font-weight: 600; }
.el .x { font-size: 13px; overflow-wrap: anywhere; }
.el .x code { font: 11.5px var(--f-mono); color: var(--muted); }
.el.config { grid-column: 1 / -1; background: var(--sunk); }
.headline { font: 500 19px/1.35 var(--f-display); margin: 0; text-wrap: pretty; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--f-body); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.stats div { background: var(--sunk); border-radius: 8px; padding: 8px 10px; }
.stats b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 11.5px; color: var(--muted); }
pre.code { margin: 0; background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font: 12px/1.5 var(--f-mono); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 4px 10px; cursor: pointer; font-size: 12.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 500; }
.btn.ghost { background: none; color: var(--accent); }
h3 { font: 600 15px var(--f-display); margin: 0; }
.sub { font-size: 12.5px; color: var(--muted); margin: 0; }
.route { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; }
.route.auto { border-color: var(--accent); }
.route.review { border-color: var(--warn); }
.route .big { font: 600 16px var(--f-display); }
label.f { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
label.f input, label.f select, label.f textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 7px 9px; color: var(--ink); min-width: 0; width: 100%; }
.form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }

/* map ---- */
.mapbox { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; }
.mapbox svg { width: 100%; height: auto; display: block; background: var(--sunk); border-radius: 8px; }
.land { fill: var(--line); stroke: none; }
.grat { stroke: var(--line); stroke-width: .4; fill: none; opacity: .7; }
.mk { stroke: var(--surface); stroke-width: 1.2; cursor: pointer; }
.mk:hover { stroke: var(--ink); }
.ramp { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.ramp i { display: inline-block; width: 26px; height: 10px; }
input[type=range] { accent-color: var(--accent); }

/* requests + about ---- */
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.req { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.req:last-child { border-bottom: 0; }
.req .id { font: 12px var(--f-mono); color: var(--muted); }
.req .t { font-weight: 500; }
.req .m { grid-column: 2 / -1; font-size: 12.5px; color: var(--muted); }
.four { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.four .el { padding: 12px 14px; }
.four .el p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.prose { max-width: 68ch; }
.prose p { margin: 0 0 8px; }
table.prod { border-collapse: collapse; width: 100%; font-size: 13px; }
table.prod th, table.prod td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.prod th { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tbl { overflow-x: auto; }
@media (max-width: 640px) { .elements { grid-template-columns: 1fr; } .brand span { display: none; } }
</style>

<script>
const DATA = /*DATA*/;

// indicators: one column each (dataset + method), grouped by family ----
const IND = [
  { id: "obis_records", fam: "Biodiversity", title: "OBIS occurrence records", unit: "records", dp: 0, grain: "decade",
    dataset: { name: "OBIS occurrence snapshot", ref: "s3://obis-open-data/occurrence/ (2026-10-11)", href: "https://obis.org/" },
    method: { name: "records inside the place, by decade", fn: "obisindicators::obis_place_indicators_exact", ver: "0.9.0 (planned)" },
    cost: () => ({ values: 0, route: "review", why: "Each new place collection is one exact join over the 100 GB OBIS snapshot." }) },
  { id: "obis_species", fam: "Biodiversity", title: "Species richness", unit: "species", dp: 0, grain: "decade",
    dataset: { name: "OBIS + WoRMS", ref: "OBIS snapshot 2026-10-11 · WoRMS 2026-10-01", href: "https://obis.org/" },
    method: { name: "distinct accepted species, by decade", fn: "obisindicators::obis_place_indicators_exact", ver: "0.9.0 (planned)" } },
  { id: "obis_es50", fam: "Biodiversity", title: "ES(50) Hurlbert", unit: "expected species", dp: 1, grain: "decade",
    dataset: { name: "OBIS + WoRMS", ref: "OBIS snapshot 2026-10-11", href: "https://obis.org/" },
    method: { name: "expected species in 50 records", fn: "obisindicators::calc_indicators", ver: "0.8.0" } },
  { id: "sst", fam: "Physical", title: "Sea surface temperature", unit: "°C", dp: 2, grain: "year",
    dataset: { name: "NOAA Coral Reef Watch 5 km", ref: "PacIOOS ERDDAP dhw_5km · CRW_SST", href: "https://pae-paha.pacioos.hawaii.edu/erddap/griddap/dhw_5km.html" },
    method: { name: "area-weighted daily mean → annual mean", fn: "erddap-places sql/stats_daily.sql", ver: "app 0.3.7" }, path: "dhw_5km/CRW_SST", cellKm2: 30, steps: 15000 },
  { id: "chl", fam: "Biogeochemistry", title: "Chlorophyll-a", unit: "mg m⁻³", dp: 2, grain: "year",
    dataset: { name: "Copernicus Marine BGC", ref: "ERDDAP cmems_biogeochem_phyto · chl", href: "https://marine.copernicus.eu/" },
    method: { name: "area-weighted monthly mean → annual mean", fn: "erddap-places sql/stats_daily.sql", ver: "app 0.3.7" }, path: "cmems_biogeochem_phyto/chl", cellKm2: 75, steps: 41 },
  { id: "ph", fam: "Biogeochemistry", title: "pH", unit: "", dp: 3, grain: "year",
    dataset: { name: "Copernicus Marine BGC", ref: "ERDDAP cmems_biogeochem_carbon · ph", href: "https://marine.copernicus.eu/" },
    method: { name: "area-weighted monthly mean → annual mean", fn: "erddap-places sql/stats_daily.sql", ver: "app 0.3.7" }, path: "cmems_biogeochem_carbon/ph", cellKm2: 75, steps: 41 },
  { id: "o2", fam: "Biogeochemistry", title: "Dissolved oxygen", unit: "mmol m⁻³", dp: 0, grain: "year",
    dataset: { name: "Copernicus Marine BGC", ref: "ERDDAP cmems_biogeochem_pp · o2", href: "https://marine.copernicus.eu/" },
    method: { name: "area-weighted monthly mean → annual mean", fn: "erddap-places sql/stats_daily.sql", ver: "app 0.3.7" }, path: "cmems_biogeochem_pp/o2", cellKm2: 75, steps: 41 },
  { id: "npp", fam: "Biogeochemistry", title: "Net primary productivity", unit: "mg C m⁻² d⁻¹", dp: 0, grain: "year",
    dataset: { name: "MODIS NPP (VGPM)", ref: "ERDDAP moda_npp_mo_glob · npp", href: "https://coastwatch.pfeg.noaa.gov/erddap/" },
    method: { name: "area-weighted monthly mean → annual mean", fn: "erddap-places sql/stats_daily.sql", ver: "app 0.3.7" }, path: "moda_npp_mo_glob/npp", cellKm2: 85, steps: 259 },
  { id: "sdg1451", fam: "SDG 14", title: "14.5.1 Marine KBAs protected", unit: "%", dp: 1, grain: "year",
    dataset: { name: "UN SDG Global Database", ref: "series ER_MRN_MPA", href: "https://unstats.un.org/sdgs/dataportal/database?series=ER_MRN_MPA" },
    method: { name: "country value → EEZ (territory, else sovereign)", fn: "places proto/eez_indicators/sdg.py", ver: "0.1" } },
];
const COLL = { noaa_sanctuaries: { name: "NOAA National Marine Sanctuaries", src: "NOAA ONMS", link: "https://sanctuaries.noaa.gov/" },
               mr_eez: { name: "Exclusive Economic Zones", src: "Marine Regions (VLIZ)", link: "https://www.marineregions.org/" } };
const DEPTH_NOTE = {
  skim: "Skimmer: a headline and a trend for each place. Open any value for the one-sentence answer.",
  swim: "Swimmer: trends with the numbers behind them. Open a value for its chart, statistics and sources.",
  dive: "Diver: every value carries its job id. Open one for the configuration, data URLs, a query and the code.",
};
const state = { view: "matrix", depth: "swim", colls: new Set(["noaa_sanctuaries", "mr_eez"]), fams: new Set(IND.map(i => i.fam)), q: "", decade: 2010, mapInd: "obis_species" };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const place = id => DATA.places.find(p => p.id === id);
const ind = id => IND.find(i => i.id === id);
const cellOf = (p, i) => (DATA.cells[p.id] || {})[i.id] || { status: i.id.startsWith("obis") ? "review" : "auto" };

function fmt(v, dp) {
  if (v == null || Number.isNaN(v)) return "–";
  if (Math.abs(v) >= 10000) return (v >= 1e6 ? (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + " M" : Math.round(v / 1000) + " k");
  return v.toLocaleString(undefined, { minimumFractionDigits: dp, maximumFractionDigits: dp });
}
// FNV-1a over the canonical configuration: a stand-in for the sha256 job id of the paper's §2.4
function jobId(s) { let h1 = 0x811c9dc5, h2 = 0x01000193; for (const ch of s) { h1 ^= ch.charCodeAt(0); h1 = Math.imul(h1, 16777619) >>> 0; h2 = Math.imul(h2 ^ h1, 2246822519) >>> 0; } return (h1.toString(16).padStart(8, "0") + h2.toString(16).padStart(8, "0")).slice(0, 12); }
function config(p, i) {
  const c = cellOf(p, i);
  return [
    `place_id: "${p.id}"`,
    `dataset_id: "${i.dataset.ref}"`,
    `method:`,
    `  function: "${i.method.fn}"`,
    `  version: "${i.method.ver}"`,
    `  arguments:`,
    `    summary: "${i.method.name}"`,
    `    time_grain: "${i.grain}"`,
    `delivery: ["viewer", "csv", "parquet", "api", "llm_tool"]`,
    `schedule: "${i.fam === "Biodiversity" ? "P1M  # with each OBIS snapshot" : i.fam === "SDG 14" ? "P1Y" : "P7D"}"`,
  ].join("\n");
}

    <p>Every value here is one job: a <b style="color:var(--el-place)">place</b>, a <b style="color:var(--el-data)">dataset</b>, a <b style="color:var(--el-method)">method</b> and a <b style="color:var(--el-delivery)">delivery</b>, bound by a configuration that hashes to a job id, is logged, and re-runs on a schedule. This is the grammar of “Coding Ocean Indicators: Patterns and People” (MBON, in revision), carried from four case studies to every combination.</p></div>
    <div class="four">
      <div class="el" style="--c:var(--el-place)"><div class="k">Place</div><p>A persistent id from the Ocean Metrics gazetteer: NOAA sanctuaries, Marine Regions MRGID, ProtectedSeas PSGID, BOEM areas. Each links back to its source.</p></div>
      <div class="el" style="--c:var(--el-data)"><div class="k">Dataset</div><p>A persistent URL to a community data service: ERDDAP™ grids and tables, the OBIS snapshot with WoRMS, Copernicus Marine, the UN SDG database.</p></div>
      <div class="el" style="--c:var(--el-method)"><div class="k">Method</div><p>A version-pinned summary: area-weighted means (erddap-places), exact point-in-polygon diversity (obisindicators), country-to-EEZ joins.</p></div>
      <div class="el" style="--c:var(--el-delivery)"><div class="k">Delivery</div><p>This viewer, CSV and Parquet, a DuckDB query, an alert, or a tool a language model can call. Skimmers, swimmers and divers enter at their own depth.</p></div>
    </div>
    <div class="card"><h3>Who computes what</h3><div class="tbl"><table class="prod">
      <thead><tr><th>Producer</th><th>Places</th><th>Indicators</th><th>How</th></tr></thead><tbody>
      <tr><td>erddap-places</td><td>Sanctuaries, any gazetteer polygon</td><td>ERDDAP grids and tables</td><td>Precomputed weekly; live in the browser for the rest</td></tr>
      <tr><td>obisindicators</td><td>EEZs, offshore regions, any collection</td><td>Records, richness, Shannon, Simpson, ES(50)</td><td>Exact join on each monthly OBIS snapshot</td></tr>
      <tr><td>obis-hex</td><td>H3 hexagons</td><td>The same diversity indices</td><td>Grid maps for exploring between places</td></tr>
      <tr><td>SDG adapter</td><td>EEZs</td><td>UN SDG 14 series</td><td>Country values joined by M49 code</td></tr>
      </tbody></table></div>
      <p class="sub">All producers write one long table (place, indicator, time grain, time, value) and one manifest, so this viewer lists everything that exists and turns every gap into a request.</p></div></div>`;
}

// wiring ----
function render() {
  document.querySelectorAll("nav.views button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === state.view));
  document.querySelectorAll(".depth button").forEach(b => b.setAttribute("aria-pressed", b.dataset.depth === state.depth));
  $("#depthNote").textContent = DEPTH_NOTE[state.depth];
  for (const v of ["matrix", "map", "requests", "about"]) $("#view-" + v).hidden = v !== state.view;
  ({ matrix: renderMatrix, map: renderMap, requests: renderRequests, about: renderAbout })[state.view]();
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("button, circle.mk"); if (!t) return;
  if (t.dataset.view) { state.view = t.dataset.view; render(); }
  else if (t.dataset.depth) { state.depth = t.dataset.depth; render(); if (!$("#drawer").hidden && state.open) openCell(...state.open); }
  else if (t.dataset.coll) { state.colls.has(t.dataset.coll) ? state.colls.delete(t.dataset.coll) : state.colls.add(t.dataset.coll); render(); }
  else if (t.dataset.fam) { state.fams.has(t.dataset.fam) ? state.fams.delete(t.dataset.fam) : state.fams.add(t.dataset.fam); render(); }
  else if (t.classList.contains("cell")) { state.open = [t.dataset.p, t.dataset.i]; openCell(...state.open); }
  else if (t.matches("circle.mk")) { state.open = [t.dataset.p, state.mapInd]; openCell(...state.open); }
  else if (t.id === "dclose") closeDrawer();
});
$("#scrim").addEventListener("click", closeDrawer);
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeDrawer(); });
document.addEventListener("input", ev => {
  if (ev.target.id === "q") { state.q = ev.target.value; const pos = ev.target.selectionStart; renderMatrix(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); }
  if (ev.target.id === "dec") { state.decade = +ev.target.value; renderMap(); }
});
document.addEventListener("change", ev => { if (ev.target.id === "mapInd") { state.mapInd = ev.target.value; renderMap(); } });
const hash = location.hash.slice(1); if (["matrix", "map", "requests", "about"].includes(hash)) state.view = hash;
render();
</script>
