# the ONMS condition-report sections: the Sanctuaries default (plan §6, Ben 2026-10-20). Condition reports follow
# DPSER: drivers and pressures; the state of sanctuary resources; ecosystem services; response.
title: ONMS condition-report sections
source: https://sanctuaries.noaa.gov/science/condition/faq.html
note: >-
  A tag places an indicator in a condition-report section. It is not a condition rating: ONMS ratings are expert
  judgments of better or worse, while the statuses here are statistical, relative to the place's own record, and
  never use the ONMS colours or symbols.
