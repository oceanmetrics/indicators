# the GOOS Essential Ocean Variables: the `eov` vocabulary (plan §8). 36 EOVs in four disciplines plus the three
# discipline terms, which tag an indicator no single EOV fits (eov_match: discipline). The colour badges are the GOOS
# originals, unmodified (assets/goos-eov/, SOURCE.md); the folder has 35 (no turbulent diapycnal fluxes). The
# glyphs eov-<id> are adapted from them (traced, monochrome, rescaled) under the CC BY of Martín Míguez et al. 2026.
title: GOOS Essential Ocean Variables
source: https://goosocean.org/what-we-do/framework/essential-ocean-variables/
credit: "Credit: Global Ocean Observing System (GOOS)"
