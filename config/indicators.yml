  # ---- OBIS place indicators, exact point-in-polygon (obisindicators, obis-h3 release) ----
  # nine metrics x all taxa and the seven EOVs, one series per EOV. yearly counts track sampling effort, so
  # status_method is values (no status); ONMS living resources, NaMES biological; the all-taxa series is tagged with
  # the biology and ecosystems discipline, each EOV series with its GOOS term.
  # -- all taxa --
  - id: "obis:records"
    title: "OBIS records, all taxa"
    short: "Records (all)"
    description: "Number of OBIS occurrence records inside the place; all taxa."
    series: obis-all
    status_method: values
    unit_label: "records"
    decimals: 0
    category: {onms: living-resources, names: biological, eov: bioeco}
    eov_match: discipline
  - id: "obis:species"
    title: "OBIS species richness, all taxa"
    short: "Species (all)"
    description: "Species richness: distinct species names among the OBIS records inside the place; all taxa."
    series: obis-all
    series_title: "OBIS (all taxa)"
    lead: true
    status_method: values
    unit_label: "species"
    decimals: 0
    category: {onms: living-resources, names: biological, eov: bioeco}
    eov_match: discipline
  - id: "obis:shannon"
    title: "OBIS Shannon diversity, all taxa"
    short: "Shannon H' (all)"
    description: "Shannon diversity H' = -sum(p ln p) over the species of the OBIS records inside the place; all taxa."
    series: obis-all
    status_method: values
    unit_label: ""
    decimals: 2
    category: {onms: living-resources, names: biological, eov: bioeco}
    eov_match: discipline
  - id: "obis:simpson"
    title: "OBIS Simpson index, all taxa"
    short: "Simpson (all)"
    description: "Simpson index, the sum of squared species shares in the OBIS records inside the place (higher is less even); all taxa."
    series: obis-all
    status_method: values
    unit_label: ""
    decimals: 3
    category: {onms: living-resources, names: biological, eov: bioeco}
    eov_match: discipline
  - id: "obis:es50"
    title: "OBIS Hurlbert ES(50), all taxa"
    short: "ES(50) (all)"
    description: "Hurlbert's expected number of species in a random draw of 50 of the place's OBIS records (empty where it has fewer than 50); all taxa."
    series: obis-all
    status_method: values
    unit_label: "species"
    decimals: 1
    category: {onms: living-resources, names: biological, eov: bioeco}
    eov_match: discipline
  - id: "obis:hill1"
    title: "OBIS Hill number N1, all taxa"
    short: "Hill N1 (all)"
    description: "Hill number N1 = exp(Shannon), the effective number of common species in the place's OBIS records; all taxa."
    series: obis-all
    status_method: values
    unit_label: ""
    decimals: 1
    category: {onms: living-resources, names: biological, eov: bioeco}
    eov_match: discipline
  - id: "obis:hill2"
    title: "OBIS Hill number N2, all taxa"
    short: "Hill N2 (all)"
    description: "Hill number N2 = 1 / Simpson, the effective number of dominant species in the place's OBIS records; all taxa."
    series: obis-all
    status_method: values
    unit_label: ""
    decimals: 1
    category: {onms: living-resources, names: biological, eov: bioeco}
    eov_match: discipline
  - id: "obis:bp"
    title: "OBIS Berger-Parker dominance, all taxa"
