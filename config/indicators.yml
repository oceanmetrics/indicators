    title: Sea surface temperature (CRW, 5 km)
    short: SST
    variable: sst
    series: sst
    series_title: Sea surface temperature
    lead: true
    unit_label: "°C"
    decimals: 2
    category: {onms: water-quality, names: physical-chemical, eov: sea-surface-temperature}
    eov_match: exact
  - id: "erddap:dhw_5km:CRW_BAA:share"
    title: Coral bleaching alert area (CRW)
    short: Bleaching alert
    description: >-
      Share of the place's area in each NOAA Coral Reef Watch bleaching alert level (0 no stress, 1 watch, 2 warning,
      3 alert level 1, 4 alert level 2), averaged over the period: the heat-stress driver of bleaching.
    variable: bleaching-alert
    series: heat-stress
    series_title: Coral heat stress
    lead: true
    kind: categorical
    ordinal: true
    status_method: values
    unit_label: share
    decimals: 2
    category: {onms: drivers-pressures, names: physical-chemical, eov: sea-surface-temperature}
    eov_match: related

  # ---- erddap-places: NOAA AOML Seascapes (8-day) ----
