# what is ours about each indicator: category tags (one per vocabulary in config/vocab/), series, lead, preferred,
# kind, the status method and its grain, and display hints. titles of datasets, units, providers, licences and
# citations come from the producers' STAC and outputs (om_indicators/manifest.py), never from here.
#
# rules the manifest builder checks: every indicator with values has an entry here; every tag is a term of its
# vocabulary; each series has exactly one lead; each `variable` has exactly one preferred indicator; kind
# categorical <=> the values carry a class.
#
# ONMS mapping (plan §6, Ben 2026-10-20): drivers and pressures = heat stress (CRW) and precipitation (IMERG);
# water quality = SST, pH and the carbonate system, O2, chl, salinity, nutrients, bottom temperature, mixed layer;
# habitat = Seascapes; living resources = NPP, phytoplankton (functional types), zooplankton, OBIS; response = SDG 14.5.1,
# 14.6.1. OBIS is shown as values (status_method: values): yearly counts track sampling effort.
# long records: where a Copernicus Marine long record (eco-indicators, 1993- or 1997-) measures the same `variable` as a
# short erddap CMEMS record (2021-2025), the long one is `preferred` and the short one is not.
# `ordinal: true` (categorical only): the classes are ordered as the manifest lists them.
# EOV mapping (plan §8): SST and heat stress -> sea surface temperature; O2 -> oxygen; pH, DIC, pCO2 -> inorganic
# carbon; chl -> ocean colour; NPP and phytoplankton carbon -> phytoplankton.

defaults:
  kind: continuous
  status_method: iea-sd
  status_grain: year
  min_periods: 10
  recent: 5
  lead: false
  preferred: true

indicators:
  # ---- erddap-places: NOAA Coral Reef Watch (daily, 1985-) ----
