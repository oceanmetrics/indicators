# indicator requests (plan §4, Phase 6): an issue from the form .github/ISSUE_TEMPLATE/indicator-request.yml is
# triaged on a GitHub runner (om_indicators/requests.py: label auto / already / needs-review, and a comment saying
# why), and an `auto` job runs on the self-hosted macmini runner: the one engine (`om-extract run`, oceanmetrics/extract,
# the chunked ERDDAP path and its STAC item writer, in place of erddap-places' precompute since 2026-10-23) computes the
# one place into erddap-places' stats/ layout, the files are published (see OM_STATS_PUBLISH below), the catalog is
# rebuilt and published, the issue gets the link and is closed.
#
# OM_STATS_PUBLISH (a repository variable) decides whether the engine's stats files are uploaded to
# gazetteer/stats/ of the bucket (om-publish.sh, both stores): unset or anything but `publish` is a dry run. the files are produced,
# listed and attached to the run as an artifact, nothing is uploaded, the catalog is not rebuilt, and the issue gets a
# comment saying so and stays open for a maintainer to re-run (the `run` label) once publishing is on. the default waited
# on the parity criterion, ledger 2026-10-23 (Ben accepted it that day; the variable is `publish` since).
#
# the compare gate (ledger 2026-10-24): after the compute, the published file of the same unit is read from the storage
# host and `om-extract compare --allow-newer` decides (scripts/stats_unit.sh gate): the order-independent columns exact,
# the sums within 1e-9 relative, the same keys, except the engine's days after the published file's last date (the
# engine caught up); a key only in the published file, or only in the engine's on or before that date, fails; no
# published file is the first publish. the files are uploaded ONLY on PASS, whatever the mode says. the verdict line is
# in the log and the run summary, and the comparison is the `compare` artifact.
#
# daily (the `daily` job, 09:30 UTC): the 36 parity units of scripts/parity_units.tsv (the 18 sanctuaries x dhw_5km
# CRW_SST and CRW_BAA) through the same steps (scripts/stats_unit.sh daily: check-job, compute, gate, publish on PASS),
# one at a time on macmini-quick in the run job's concurrency group. a unit whose compute fails (a PacIOOS outage) is
# retried 3 times 10 min apart, then skipped and listed, never published in part. 09:30 UTC: NOAA CRW posts day D on
# its server in the afternoon (US Eastern) of D+1 and PacIOOS's ERDDAP serves it by that evening (2026-10-22 was there by
# 21:14 UTC on 10-23, 10-23 not yet at 02:57 UTC on 10-24; the dataset's metadata carries no update hour), so 09:30 is
# well after the day's update and before 14:15 UTC, when erddap-places' stats run wrote these files until 2026-10-24.
#
# a Copernicus Marine request (cmems: indicators) is never `auto`: it uses a maintainer's personal Copernicus Marine
# login. triage marks it `needs-review` with approvable=true when the place producer can do it, and a maintainer's `run`
# label then starts the same run job with the Copernicus Marine place producer (om_indicators/producers/cmems_place.py,
# `uv run --group cmems`, a thin call into om-extract's Copernicus Marine reader, the engine `om-extract run --reader
# copernicus` runs) in place of the ERDDAP engine run; the catalog rebuild and the closing comment are the same. which
# producer runs is decided in the job from the checked indicator id (check-job prints REQ_FAMILY), never from the issue.
#
# the issue is untrusted input: its body reaches the triage only as a file written from an environment variable, never
# through ${{ }} in a script; the run job re-checks the job (check-job) and passes each value as an environment
# variable. an `auto` job runs by itself while the repository variable REQUESTS_AUTORUN is `on` (at most
# REQUESTS_PER_DAY, default 10, in 24 h); otherwise, or past the cap, a maintainer starts it by adding the `run` label
# (only people with triage access can add labels, and labels this workflow's own token adds start no run; REQUESTS_AUTORUN
# never starts a Copernicus Marine request). requesters are answered on the issue only: no email (yet).
#
# refresh: a maintainer's `run` label on an `already` request (the place has values for it) is a refresh of the existing
# values: triage gives the job a new request would get, with approvable and refresh true, and the run job takes it like an
# approved request (how the existing sanctuary units are recomputed). the label is maintainer-only twice over: GitHub lets
# only people with triage access add labels, and the triage step passes --run-label only when the labeler (the event's
# sender) has write, maintain or admin permission on the repository (the collaborators API), so a refresh never starts
# on a label from anyone else.
#
# workflow_dispatch: the same run job without an issue (the place, collection, dataset and variable as inputs; the
# indicator is erddap:<dataset>:<variable>:mean, checked by check-job like any job). triage and the comment-and-close steps
# are skipped and the job writes its summary to the run page instead. `publish` (default false) is the dispatch's
# OM_STATS_PUBLISH: true uploads the stats files and rebuilds the catalog, false is a dry run; OM_STATS_PUBLISH itself
# applies to issue runs only.
name: requests

on:
  issues:
    types: [opened, edited, reopened, labeled]
  schedule:
    - cron: '30 9 * * *'      # 09:30 UTC daily: the parity units (the `daily` job), see the header
  workflow_dispatch:
    inputs:
      place:
        description: place_id, like NMS:CINMS (one unit; not used with daily)
        required: false
        type: string
      coll:
        description: the place's collection slug, like places
        required: false
        type: string
      dataset:
        description: ERDDAP dataset id, like dhw_5km
        required: false
        type: string
      variable:
        description: variable of the dataset, like CRW_SST
        required: false
        type: string
      publish:
        description: upload the stats files to gazetteer/stats/ (only on the gate's PASS) and rebuild the catalog (false is a dry run)
        required: false
        type: boolean
        default: false
      reference_version:
        description: "a test of the gate: compare against this S3 version id of the published file instead (never publishes)"
        required: false
        type: string
        default: ''
      daily:
        description: run the daily job (scripts/parity_units.tsv) instead of one unit
        required: false
        type: boolean
        default: false
      units:
        description: "daily only: an extended regex a line of parity_units.tsv must match (default: every unit)"
        required: false
        type: string
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  triage:
    if: >-
      github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'request') &&
      (github.event.action != 'labeled' || github.event.label.name == 'run')
    runs-on: ubuntu-latest
    concurrency:
      group: request-triage-${{ github.event.issue.number }}
      cancel-in-progress: true
    outputs:
      label: ${{ steps.triage.outputs.label }}
      approvable: ${{ steps.triage.outputs.approvable }}
      refresh: ${{ steps.triage.outputs.refresh }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: triage
        id: triage
        env:
          BODY: ${{ github.event.issue.body }}
          NUM: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          AUTORUN: ${{ vars.REQUESTS_AUTORUN }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          SENDER: ${{ github.event.sender.login }}
          REPO: ${{ github.repository }}
        run: |
          printf '%s' "$BODY" > body.md
          # the `run` label refreshes an `already` request only when its labeler can write to the repository
          runflag=()
          if [ "$ACTION" = labeled ] && [ "$LABEL" = run ]; then
            perm=$(gh api "repos/$REPO/collaborators/$SENDER/permission" --jq .permission 2>/dev/null || echo none)
            echo "the run label was added by a user with $perm permission"
            case "$perm" in admin|maintain|write) runflag=(--run-label) ;; esac
          fi
          uv run python -m om_indicators.requests triage --body body.md --out triage.json --comment comment.md \
            --autorun "${AUTORUN:-off}" "${runflag[@]}"
          label=$(jq -r .label triage.json)
          approvable=$(jq -r '.approvable // false' triage.json)
          refresh=$(jq -r '.refresh // false' triage.json)
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "approvable=$approvable" >> "$GITHUB_OUTPUT"
          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"
          for l in auto already needs-review; do
            gh label create "$l" --color ededed --force >/dev/null 2>&1 || true
            [ "$l" = "$label" ] || gh issue edit "$NUM" --remove-label "$l" >/dev/null 2>&1 || true
          done
          gh issue edit "$NUM" --add-label "$label"
          # a maintainer's `run` label re-checks the request without commenting again, except a refresh, which says so
          if [ "$ACTION" != labeled ] || [ "$refresh" = true ]; then gh issue comment "$NUM" --body-file comment.md; fi
          # the `run` label on a request nothing can run says so, instead of doing nothing
          if [ "$ACTION" = labeled ] && [ "$LABEL" = run ] && [ "$label" = needs-review ] && [ "$approvable" != true ]; then
            gh issue comment "$NUM" --body "The \`run\` label starts a request only when this bot says a maintainer can accept it that way; this one needs a maintainer's own work (see the reasons above)."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: triage
          path: triage.json
          retention-days: 7

  run:
    needs: triage
    # an `auto` request runs by itself (REQUESTS_AUTORUN) or on the `run` label; a request triage marked approvable (a
    # Copernicus Marine one, or a refresh of existing values) runs only on a maintainer's `run` label, never by itself; a
    # manual dispatch runs without an issue (triage is skipped then, so !cancelled() keeps the job from being skipped with it)
    if: >-
      !cancelled() && ((github.event_name == 'workflow_dispatch' && !inputs.daily) ||
      (needs.triage.outputs.label == 'auto' &&
       ((github.event.action != 'labeled' && vars.REQUESTS_AUTORUN == 'on') || github.event.label.name == 'run')) ||
      (needs.triage.outputs.approvable == 'true' && github.event.action == 'labeled' && github.event.label.name == 'run'))
    # the Mac mini's second runner, for short jobs: on the first (`macmini`) a request waited behind erddap-places' daily
    # precompute, which runs for hours (issue #2, 2026-10-20)
    runs-on: [self-hosted, macmini-quick]
    concurrency:
      group: requests-run           # one job at a time on the runner, never cancelled mid-run
      cancel-in-progress: false
    timeout-minutes: 180
    env:
      AWS_DEFAULT_REGION: us-east-1
      NUM: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
      ACTION: ${{ github.event.action }}
      EVENT: ${{ github.event_name }}
      OM_PUBLISH: ${{ github.workspace }}/.om-platform/scripts/om-publish.sh
    steps:
      - uses: actions/checkout@v4
      # the one publisher of the bucket, oceanmetrics/platform scripts/om-publish.sh at main (both stores, R2 then S3;
      # never deletes), found by the publish scripts through OM_PUBLISH; the R2 keys stay on the host like the AWS profile
      # (~/.config/oceanmetrics/rclone-r2.sh sources r2.env)
      - uses: actions/checkout@v4
        with:
          repository: oceanmetrics/platform
          path: .om-platform
          sparse-checkout: scripts/om-publish.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          name: triage
      - name: check the job again
        if: github.event_name != 'workflow_dispatch'
        run: |
          export PATH="/opt/homebrew/bin:$HOME/.local/bin:$PATH"
          jq '.job' triage.json > job.json
          uv run python -m om_indicators.requests check-job job.json >> "$GITHUB_ENV"
      # the dispatch's job from its inputs (passed as environment, never spliced into the script), checked like any other
      - name: the job from the dispatch inputs, checked
        if: github.event_name == 'workflow_dispatch'
        env:
          IN_PLACE: ${{ inputs.place }}
          IN_COLL: ${{ inputs.coll }}
          IN_DATASET: ${{ inputs.dataset }}
          IN_VARIABLE: ${{ inputs.variable }}
        run: |
          export PATH="/opt/homebrew/bin:$HOME/.local/bin:$PATH"
          jq -n --arg place "$IN_PLACE" --arg coll "$IN_COLL" --arg dataset "$IN_DATASET" --arg variable "$IN_VARIABLE" \
            '{place: $place, coll: $coll, dataset: $dataset, variable: $variable, indicator: ("erddap:" + $dataset + ":" + $variable + ":mean")}' > job.json
          uv run python -m om_indicators.requests check-job job.json >> "$GITHUB_ENV"
      - name: daily cap (automatic runs only; a maintainer's `run` label is not capped)
        id: cap
        if: github.event_name == 'issues' && github.event.action != 'labeled'
        run: |
          since=$(date -u -v-1d +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh issue list --label auto-done --state closed --search "closed:>$since" --json number --jq length)
          echo "done in 24 h: $n of ${REQUESTS_PER_DAY:-10}"
          if [ "$n" -ge "${REQUESTS_PER_DAY:-10}" ]; then
            gh issue comment "$NUM" --body "Today's automatic runs are used up; a maintainer starts this one by adding the \`run\` label."
            echo "over=1" >> "$GITHUB_OUTPUT"
          fi
        env:
          REQUESTS_PER_DAY: ${{ vars.REQUESTS_PER_DAY }}
      # the packages from npm: @oceanmetrics/catalog carries the values contract's schemas (om_extract finds them in
      # node_modules), which both producers (`om-extract run` and the Copernicus Marine one) need before the rebuild step
      - name: install the npm packages
        if: steps.cap.outputs.over != '1'
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          npm ci --no-audit --no-fund
      - name: compute the place (om-extract, the chunked engine and its stats item)
        if: steps.cap.outputs.over != '1' && env.REQ_FAMILY != 'cmems'
        env:
          OM_CHUNKS: ${{ vars.OM_CHUNKS }}
        run: |
          export PATH="/opt/homebrew/bin:$HOME/.local/bin:$PATH"
          # om-extract run into out/gazetteer/stats and out/run (the same command as the daily job's)
          scripts/stats_unit.sh compute out
      - name: list the stats files and decide the mode (OM_STATS_PUBLISH, or the dispatch's publish)
        id: stats
        if: steps.cap.outputs.over != '1' && env.REQ_FAMILY != 'cmems'
        env:
          OM_STATS_PUBLISH: ${{ vars.OM_STATS_PUBLISH }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
          REF_VERSION: ${{ inputs.reference_version }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          # dry-run by default (it waited on the parity criterion, ledger 2026-10-23); `publish` uploads, after the gate's PASS
          mode=dry-run
          if [ "$EVENT" = workflow_dispatch ]; then
            # a dispatch decides by its own `publish` input (default false), whatever OM_STATS_PUBLISH says
            if [ "${DISPATCH_PUBLISH:-}" = true ]; then mode=publish; fi
          elif [ "${OM_STATS_PUBLISH:-}" = publish ]; then
            mode=publish
          fi
          # a test reference (reference_version) tests the gate: such a run never publishes
          if [ -n "${REF_VERSION:-}" ] && [ "$mode" = publish ]; then
            echo "reference_version is set (a test of the gate): a dry run, whatever publish says"
            mode=dry-run
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          cd out/gazetteer
          # the upload order: the parquet, its provenance, then the item (it records the others' size and checksum)
          { find stats -name '*.parquet' | sort; find stats -name '*.provenance.json' | sort; find stats/items -name '*.json' | sort; } > ../stats_files.txt
          echo "$(wc -l < ../stats_files.txt | tr -d ' ') stats file(s), mode $mode:"
          cat ../stats_files.txt
          # the artifact is a tarball: actions/upload-artifact refuses the ':' of a place id in a file name
          tar -czf ../stats.tgz stats
      # the compare gate: the published file of the same unit from the storage host against the engine's
      # (om-extract compare --allow-newer); a FAIL ends the job here, so nothing is uploaded
      - name: the compare gate (om-extract compare against the published file)
        id: gate
        if: steps.cap.outputs.over != '1' && env.REQ_FAMILY != 'cmems'
        env:
          REF_VERSION: ${{ inputs.reference_version }}
        run: |
          export PATH="/opt/homebrew/bin:$HOME/.local/bin:$PATH"
          rc=0
          scripts/stats_unit.sh gate out || rc=$?
          echo "verdict=$(grep -o 'verdict: [A-Z]*' out/compare/verdict.txt | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          if [ "$rc" != 0 ]; then echo "::error::$(cat out/compare/verdict.txt)"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.cap.outputs.over != '1' && env.REQ_FAMILY != 'cmems'
        with:
          name: stats
          path: |
            out/stats.tgz
            out/stats_files.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always() && steps.cap.outputs.over != '1' && env.REQ_FAMILY != 'cmems'
        with:
          name: compare
          path: out/compare/
          retention-days: 30
      - name: upload the stats files (publish mode and the gate's PASS only)
        if: steps.cap.outputs.over != '1' && env.REQ_FAMILY != 'cmems' && steps.stats.outputs.mode == 'publish' && steps.gate.outputs.verdict == 'PASS'
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          # om-publish.sh, both stores: the parquet, its provenance, then the item; refuses without the gate's PASS
          scripts/stats_unit.sh publish out
      - name: compute the place (Copernicus Marine place producer, with the maintainer's own login)
        if: steps.cap.outputs.over != '1' && env.REQ_FAMILY == 'cmems'
        run: |
          export PATH="/opt/homebrew/bin:$HOME/.local/bin:$PATH"
          # the Toolbox finds its login in the runner user's ~/.copernicusmarine and the upload goes through om-publish.sh;
          # --publish uploads the place's folder and the merged index.json under indicators/producers/cmems/
          uv run --group cmems python -m om_indicators.producers.cmems_place \
            --place "$REQ_PLACE" --coll "$REQ_COLL" --indicator "$REQ_INDICATOR" --publish
      # a dry run published no stats file, so the requested item would point at nothing: no rebuild, no closing comment
      - name: rebuild and publish the catalog
        if: steps.cap.outputs.over != '1' && (env.REQ_FAMILY == 'cmems' || steps.stats.outputs.mode == 'publish')
        run: |
          export PATH="/opt/homebrew/bin:$HOME/.local/bin:$PATH"
          # a stats item (the engine's, in erddap-places' layout) goes on the requested-items list, which the build reads and the publish keeps; a Copernicus
          # Marine place is in the producer's published index.json, which the cmems-places step of the build reads
          if [ "$REQ_FAMILY" != cmems ]; then
            uv run python -m om_indicators.requests add-item job.json --out requested_items.json
            "$OM_PUBLISH" --really --cache-control "public, max-age=300" requested_items.json indicators/requests --as items.json
          fi
          scripts/build_catalog.sh
          # the change feed, as in catalog.yml: a computed place is a change (its first values); a failure never blocks the publish
          npm run -s changes:build -- catalog --prev https://s3.us-east-1.amazonaws.com/oceanmetrics.io-public/indicators/coverage.parquet \
            || echo "::warning::the change files were not written; recover them with scripts/backfill_changes.mjs"
          scripts/publish_catalog.sh
      - name: answer the issue
        if: github.event_name == 'issues' && steps.cap.outputs.over != '1' && (env.REQ_FAMILY == 'cmems' || steps.stats.outputs.mode == 'publish')
        run: |
          link="https://oceanmetrics.io/indicators/#view=place&place=${REQ_PLACE}&coll=${REQ_COLL}&ind=${REQ_INDICATOR}"
          # a run that started by itself is `auto-done`, which the daily cap counts; one a maintainer started with the `run`
          # label (an approved Copernicus Marine request, or an auto one past the cap) is `run-done`, which it does not
          if [ "$ACTION" = labeled ]; then done=run-done; else done=auto-done; fi
          gh label create "$done" --color 0e8a16 --force >/dev/null 2>&1 || true
          gh issue comment "$NUM" --body "Done: the values are published. Place view: $link"
          gh issue edit "$NUM" --add-label "$done"
          gh issue close "$NUM" --reason completed
      - name: answer the issue (a dry run, computed but not published)
        if: github.event_name == 'issues' && steps.cap.outputs.over != '1' && env.REQ_FAMILY != 'cmems' && steps.stats.outputs.mode != 'publish'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(wc -l < out/stats_files.txt | tr -d ' ')
          gh issue comment "$NUM" --body "Computed, not published yet: the new extraction engine wrote $n stats file(s) for this place, attached to the run as the \`stats\` artifact ($RUN_URL). Publishing them waits on a maintainer's check of the engine against the published statistics; the issue stays open and a maintainer re-runs it with the \`run\` label once publishing is on."
      - name: say so when it failed
        if: failure() && github.event_name == 'issues'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$NUM" --body "The run failed; a maintainer will look at it. Run log: $RUN_URL"
      # a dispatch has no issue to answer: the run page says what was computed and whether it was published
      - name: write the summary (a dispatch)
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          JOB_STATUS: ${{ job.status }}
          MODE: ${{ steps.stats.outputs.mode }}
          REF_VERSION: ${{ inputs.reference_version }}
        run: |
          {
            echo "### requests dispatch: ${REQ_INDICATOR:-no valid job} at ${REQ_PLACE:-?} (${REQ_COLL:-?})"
            echo
            echo "- status: $JOB_STATUS, mode: ${MODE:-not reached}"
            if [ -f out/compare/verdict.txt ]; then echo "- gate: \`$(cat out/compare/verdict.txt)\`"; fi
            if [ -f out/compare/reference.txt ]; then echo "- $(cat out/compare/reference.txt)"; fi
            if [ -f out/stats_files.txt ]; then
              echo "- $(wc -l < out/stats_files.txt | tr -d ' ') stats file(s):"
              sed 's/^/  - `/; s/$/`/' out/stats_files.txt
            fi
            if [ "$MODE" = publish ] && [ "$JOB_STATUS" = success ] && grep -q 'verdict: PASS' out/compare/verdict.txt; then
              echo "- published; Place view: https://oceanmetrics.io/indicators/#view=place&place=${REQ_PLACE}&coll=${REQ_COLL}&ind=${REQ_INDICATOR}"
            elif [ "$MODE" = dry-run ]; then
              echo "- dry run: nothing uploaded to gazetteer/stats/ (the files are in the \`stats\` artifact)"
            else
              echo "- not published (the gate refused or a step failed; the comparison is the \`compare\` artifact)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # the parity units every day (09:30 UTC, see the header), or a dispatch with daily=true: scripts/stats_unit.sh daily
  # runs each unit of scripts/parity_units.tsv through the run job's own steps (check-job, compute, the compare gate,
  # publish only on PASS), one at a time, in the run job's concurrency group on the same runner
  daily:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.daily)
    runs-on: [self-hosted, macmini-quick]
    concurrency:
      group: requests-run           # one job at a time on the runner, never cancelled mid-run
      cancel-in-progress: false
    # 36 units of a few minutes each, plus one unit's retries (30 min) in an outage
    timeout-minutes: 300
    env:
      AWS_DEFAULT_REGION: us-east-1
      OM_PUBLISH: ${{ github.workspace }}/.om-platform/scripts/om-publish.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: oceanmetrics/platform
          path: .om-platform
          sparse-checkout: scripts/om-publish.sh
          sparse-checkout-cone-mode: false
      - name: install the npm packages
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          npm ci --no-audit --no-fund
      - name: the parity units, each computed, gated and published on PASS
        id: units
        env:
          OM_CHUNKS: ${{ vars.OM_CHUNKS }}
          # the schedule publishes; a dispatch by its own `publish` input
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
          UNITS_FILTER: ${{ inputs.units }}
        run: |
          export PATH="/opt/homebrew/bin:$HOME/.local/bin:$PATH"
          rm -rf out
          rc=0
          scripts/stats_unit.sh daily scripts/parity_units.tsv out/daily || rc=$?
          cat out/daily/summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ -s out/daily/published.txt ]; then echo "published=1" >> "$GITHUB_OUTPUT"; fi
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare-daily
          path: |
            out/daily/summary.md
            out/daily/*/verdict.txt
            out/daily/*/compute.log
            out/daily/*/compare/
          retention-days: 30
      # once for the day, as the run job does after a publish: the stats items on the requested-items list, the catalog
      # rebuilt and published (a refused or skipped unit does not hold the others back)
      - name: rebuild and publish the catalog
        if: always() && steps.units.outputs.published == '1'
        run: |
          export PATH="/opt/homebrew/bin:$HOME/.local/bin:$PATH"
          # the published list first (add-item's default), then the local one it wrote
          listarg=()
          for d in out/daily/*/; do
            grep -qxF "$(jq -r '.dataset + "/" + .variable + "/" + .place' "$d/job.json")" out/daily/published.txt || continue
            uv run python -m om_indicators.requests add-item "$d/job.json" "${listarg[@]}" --out requested_items.json.new
            mv requested_items.json.new requested_items.json
            listarg=(--list requested_items.json)
          done
          "$OM_PUBLISH" --really --cache-control "public, max-age=300" requested_items.json indicators/requests --as items.json
          scripts/build_catalog.sh
          npm run -s changes:build -- catalog --prev https://s3.us-east-1.amazonaws.com/oceanmetrics.io-public/indicators/coverage.parquet \
            || echo "::warning::the change files were not written; recover them with scripts/backfill_changes.mjs"
          scripts/publish_catalog.sh
