# until Day 5 (2026-10-26) the status package is a file: link to a sibling checkout of oceanmetrics/platform
# build the indicator catalog from what the producers publish and sync it to s3://oceanmetrics.io-public/indicators/
#
# runs on the self-hosted `macmini` runner (the oceanmetrics org runner that also runs erddap-places `stats` and
# places `sync`, one job at a time): uv, node and the aws cli come from Homebrew, and the sync uses the host's AWS
# profile (~/.aws); the repository holds no secrets. Triggers are schedule and dispatch only, never a pull request,
# so no fork's code reaches the runner.
name: catalog

on:
  schedule:
    - cron: '7 8 * * *'      # 08:07 UTC daily, before the erddap-places stats run (09:17) starts the next day's work
  workflow_dispatch:
    inputs:
      publish:
        description: 'sync to S3 when the catalog validates'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    # the Mac mini's second runner, for short jobs: the first (`macmini`) holds erddap-places' daily precompute for hours,
    # and a runner takes one job at a time
    runs-on: [self-hosted, macmini-quick]
    timeout-minutes: 60
    env:
      AWS_DEFAULT_REGION: us-east-1
    defaults:
      run:
        working-directory: indicators
    steps:
      - uses: actions/checkout@v4
        with:
          path: indicators
      - uses: actions/checkout@v4
        with:
          repository: oceanmetrics/platform
          ref: main
          path: platform
      - name: build @oceanmetrics/status (a file link, see the note at the top)
        working-directory: platform
        run: npm ci && npm run build
      - name: host tools
        run: |
          export PATH=/opt/homebrew/bin:$PATH
          uv --version; node --version; aws --version
      # cmems: the Copernicus Marine place producer's scientific stack, so its tests run here too (they skip without it)
      - run: uv sync --group dev --group cmems
      - run: npm ci
      - name: tests (contract, adapters, manifest, status, coverage)
        run: |
          uv run --group dev --group cmems pytest -q
          npx vitest run src
      - name: build the catalog (erddap-places, eco-indicators and obis rebuilt, SDG pulled from the published catalog)
        run: scripts/build_catalog.sh catalog
      # the SanctuaryWatch pilot figures (plan §7): the bundle for CINMS, its PNGs drawn by the deployed embed route,
      # published under indicators/sanctuarywatch/ so each figure.png keeps a stable URL. a failure here never blocks
      # the catalog
      - name: SanctuaryWatch figures (CINMS)
        continue-on-error: true
        run: |
          export PATH=/opt/homebrew/bin:$PATH
          CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
            node --experimental-strip-types scripts/sanctuarywatch_bundle.ts --place NMS:CINMS --catalog catalog --png
      - name: publish
        if: github.event_name == 'schedule' || inputs.publish
        run: scripts/publish_catalog.sh catalog
